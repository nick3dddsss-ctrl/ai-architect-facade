name: Build Dania Fedorina Makeup TV Native v2.1

on:
  push:
    branches: ["makeup-tv-app"]
    paths:
      - 'makeup-tv-v21/**'
      - '.github/workflows/build-makeup-tv-v21.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reassemble Android TV project
        run: |
          rm -rf makeup-tv-v21/build-src
          mkdir -p makeup-tv-v21/build-src
          cat makeup-tv-v21/parts/v21.part* > /tmp/makeup-tv-v21.b64
          test "$(wc -c < /tmp/makeup-tv-v21.b64)" -eq 40300
          base64 -d /tmp/makeup-tv-v21.b64 > /tmp/makeup-tv-v21.zip
          unzip -t /tmp/makeup-tv-v21.zip
          unzip -q /tmp/makeup-tv-v21.zip -d makeup-tv-v21/build-src

      - name: Build debug APK
        working-directory: makeup-tv-v21/build-src
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp makeup-tv-v21/build-src/app/build/outputs/apk/debug/app-debug.apk dist/Dania-Fedorina-Makeup-TV-v2.1.0-improved.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dania-Fedorina-Makeup-TV-v2.1.0-improved
          path: dist/Dania-Fedorina-Makeup-TV-v2.1.0-improved.apk
          if-no-files-found: error
