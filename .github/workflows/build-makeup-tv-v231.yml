name: Build Dania Fedorina Makeup TV v2.3.1 Covers

on:
  push:
    branches: ["makeup-tv-app"]
    paths:
      - 'makeup-tv-v231/**'
      - '.github/workflows/build-makeup-tv-v231.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Reassemble v2.2 base
        run: |
          rm -rf /tmp/makeup231
          mkdir -p /tmp/makeup231
          cat makeup-tv-v22/parts/v22.part* > /tmp/makeup-v22.b64
          test "$(wc -c < /tmp/makeup-v22.b64)" -eq 42844
          base64 -d /tmp/makeup-v22.b64 > /tmp/makeup-v22.zip
          unzip -t /tmp/makeup-v22.zip
          unzip -q /tmp/makeup-v22.zip -d /tmp/makeup231

      - name: Add cover artwork
        run: bash makeup-tv-v231/prepare_assets.sh

      - name: Patch v2.3.1 UI
        run: python3 makeup-tv-v231/patch_v231.py

      - name: Build APK
        working-directory: /tmp/makeup231
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect and verify APK
        run: |
          mkdir -p dist
          cp /tmp/makeup231/app/build/outputs/apk/debug/app-debug.apk dist/Dania-Fedorina-Makeup-TV-v2.3.1-covers.apk
          unzip -t dist/Dania-Fedorina-Makeup-TV-v2.3.1-covers.apk
          sha256sum dist/Dania-Fedorina-Makeup-TV-v2.3.1-covers.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dania-Fedorina-Makeup-TV-v2.3.1-covers
          path: dist/Dania-Fedorina-Makeup-TV-v2.3.1-covers.apk
          if-no-files-found: error
