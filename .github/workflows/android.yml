name: CineDeck Android TV APK
on:
  push:
    branches: [ "cinedeck-tv-build" ]
    paths: [ "CineDeckTV/**", ".github/workflows/android.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare offline catalog and posters
        run: python3 CineDeckTV/tools/prepare_offline_catalog.py
      - name: Inspect bundled catalog
        run: |
          test -f CineDeckTV/app/src/main/assets/catalog.json
          echo "Catalog bytes: $(wc -c < CineDeckTV/app/src/main/assets/catalog.json)"
          echo "Posters: $(find CineDeckTV/app/src/main/assets/posters -type f | wc -l)"
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "Using sdkmanager: $SDKMANAGER"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK
        working-directory: CineDeckTV
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CineDeckTV-debug-apk
          path: CineDeckTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
