name: CineDeck Android TV APK
on:
  push:
    branches: [ "cinedeck-tv-build" ]
    paths: [ "CineDeckTV/**", ".github/workflows/android.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build APK
        working-directory: CineDeckTV
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CineDeckTV-debug-apk
          path: CineDeckTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
