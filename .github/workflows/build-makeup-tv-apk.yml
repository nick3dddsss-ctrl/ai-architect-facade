name: Build Dania Fedorina Makeup TV APK

on:
  push:
    branches: ["makeup-tv-app"]
    paths:
      - 'makeup-tv/**'
      - '.github/workflows/build-makeup-tv-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Unpack Android project
        run: |
          mkdir -p makeup-tv/build-src
          base64 -d makeup-tv/project.zip.b64 > /tmp/makeup-tv-project.zip
          unzip -q /tmp/makeup-tv-project.zip -d makeup-tv/build-src

      - name: Build debug APK
        working-directory: makeup-tv/build-src
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp makeup-tv/build-src/app/build/outputs/apk/debug/app-debug.apk dist/Dania-Fedorina-Makeup-TV-v0.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dania-Fedorina-Makeup-TV-APK
          path: dist/Dania-Fedorina-Makeup-TV-v0.1.apk
          if-no-files-found: error
