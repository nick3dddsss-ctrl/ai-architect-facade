name: Build Makeup TV APK v0.1.1

on:
  push:
    branches: ["makeup-tv-app"]
    paths:
      - 'makeup-tv/project-v0.1.1.zip.b64'
      - '.github/workflows/build-makeup-tv-apk-v011.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unpack project
        run: |
          mkdir -p makeup-tv/build-v011
          base64 -d makeup-tv/project-v0.1.1.zip.b64 > /tmp/makeup-tv-v011.zip
          unzip -q /tmp/makeup-tv-v011.zip -d makeup-tv/build-v011
      - name: Build APK
        working-directory: makeup-tv/build-v011
        run: gradle :app:assembleDebug --stacktrace
      - name: Collect APK
        run: |
          mkdir -p dist
          cp makeup-tv/build-v011/app/build/outputs/apk/debug/app-debug.apk dist/Dania-Fedorina-Makeup-TV-v0.1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dania-Fedorina-Makeup-TV-APK-v0.1.1
          path: dist/Dania-Fedorina-Makeup-TV-v0.1.1.apk
          if-no-files-found: error
