name: Refresh CineDeck Official Autoplay

on:
  push:
    branches: [ "cinedeck-tv-build" ]
    paths:
      - "CineDeckTV/tools/prepare_autoplay_catalog.py"
      - ".github/workflows/refresh_autoplay.yml"
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinedeck-tv-build
      - name: Build official zero-config autoplay catalog
        run: python3 CineDeckTV/tools/prepare_autoplay_catalog.py
      - name: Commit autoplay feed and posters
        run: |
          git config user.name "CineDeck Official Catalog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog-data/autoplay.json catalog-data/autoplay-posters
          if git diff --cached --quiet; then
            echo "Autoplay feed unchanged"
          else
            git commit -m "Refresh CineDeck official autoplay feed [skip ci]"
            git push origin HEAD:cinedeck-tv-build
          fi
