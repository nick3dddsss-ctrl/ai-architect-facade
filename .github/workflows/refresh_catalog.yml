name: Refresh CineDeck Online Catalog

on:
  push:
    branches: [ "cinedeck-tv-build" ]
    paths:
      - "CineDeckTV/tools/prepare_online_catalog.py"
      - ".github/workflows/refresh_catalog.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinedeck-tv-build
      - name: Build remote catalog
        run: python3 CineDeckTV/tools/prepare_online_catalog.py
      - name: Commit refreshed feed
        run: |
          git config user.name "CineDeck Catalog Bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog-data/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "Refresh CineDeck online catalog [skip ci]"
            git push origin HEAD:cinedeck-tv-build
          fi
