name: NSPD parcel 8732 check

on:
  push:
    branches:
      - experiment/nspd-8732

permissions: {}

jobs:
  cadastral-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install pynspd
        run: python -m pip install --disable-pip-version-check 'pynspd==1.1.15'
      - name: Diagnose NSPD availability and request parcel
        shell: bash
        run: |
          timeout 90s python -u - <<'PY'
          import json, traceback, time
          from pathlib import Path
          import httpx

          number = "30:12:000000:8732"
          result = {"cadastral_number": number, "http_probe": {}, "pynspd": {}}
          try:
              start = time.monotonic()
              url = "https://nspd.gov.ru/api/geoportal/v2/search/geoportal"
              r = httpx.get(url, params={"query": number, "thematicSearchId": 1},
                            follow_redirects=False, timeout=12.0)
              result["http_probe"] = {"status_code": r.status_code,
                 "elapsed_s": round(time.monotonic() - start, 1),
                 "body_excerpt": r.text[:500]}
          except Exception as e:
              result["http_probe"] = {"error": repr(e)}
          print("HTTP_PROBE", json.dumps(result["http_probe"], ensure_ascii=False), flush=True)

          try:
              from pynspd import Nspd
              from shapely.geometry import mapping
              from pyproj import Geod
              start = time.monotonic()
              with Nspd(client_timeout=12, client_retries=0, trust_env=False) as client:
                  feat = client.find_landplot(number)
              if feat is None:
                  raise RuntimeError("find_landplot returned None")
              if feat.geometry is None:
                  raise RuntimeError("Feature has no geometry")
              shape = feat.geometry.to_shape()
              if shape.is_empty:
                  raise RuntimeError("Geometry is empty")
              bbox = list(shape.bounds)
              if not (47 <= bbox[0] <= bbox[2] <= 49 and 45 <= bbox[1] <= bbox[3] <= 48):
                  raise RuntimeError(f"Unexpected WGS84 bounds: {bbox}")
              result["pynspd"] = {"status": "success",
                 "bbox_wgs84": bbox,
                 "area_wgs84_geodesic_m2": round(abs(Geod(ellps="WGS84").geometry_area_perimeter(shape)[0]),2),
                 "elapsed_s": round(time.monotonic()-start,1)}
              geojson = {"type":"FeatureCollection", "features":[{"type":"Feature",
                   "properties":{"cadastral_number":number,"source":"NSPD via pynspd; non-certified"},
                   "geometry":mapping(shape)}]}
              Path("parcel_8732.geojson").write_text(
                   json.dumps(geojson,ensure_ascii=False,indent=2),encoding="utf-8")
          except Exception as e:
              result["pynspd"] = {"status": "failed", "error": repr(e)}
              traceback.print_exc()
          print("PYNSPD_RESULT", json.dumps(result["pynspd"],ensure_ascii=False),flush=True)
          Path("check_result.json").write_text(
              json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Upload diagnostic result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nspd-8732-result
          path: |
            check_result.json
            parcel_8732.geojson
          if-no-files-found: warn
