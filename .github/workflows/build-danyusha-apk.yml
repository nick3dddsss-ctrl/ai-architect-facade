name: Build Danyusha Beauty City APK

on:
  push:
    branches:
      - danyusha-beauty-city
    paths:
      - 'danyusha-beauty-city/**'
      - '.github/workflows/build-danyusha-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: danyusha-beauty-city
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp danyusha-beauty-city/app/build/outputs/apk/debug/app-debug.apk artifacts/Danyusha_Beauty_City_v0.4-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Danyusha_Beauty_City_v0.4_APK
          path: artifacts/Danyusha_Beauty_City_v0.4-debug.apk
          retention-days: 30

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 9 smoke and real render verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r danyusha-beauty-city/app/build/outputs/apk/debug/app-debug.apk
            adb install -r danyusha-beauty-city/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w com.danyusha.beautyrun.test/com.danyusha.beautyrun.SmokeInstrumentation | tee artifacts/smoke.txt
            grep -q DANYUSHA_SMOKE_PASS artifacts/smoke.txt
            adb exec-out run-as com.danyusha.beautyrun cat cache/title.png > artifacts/title.png
            adb exec-out run-as com.danyusha.beautyrun cat cache/level.png > artifacts/level.png
            adb exec-out run-as com.danyusha.beautyrun cat cache/jump.png > artifacts/jump.png

      - name: Upload verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Danyusha_v0.4_verification
          path: artifacts/
          retention-days: 30
