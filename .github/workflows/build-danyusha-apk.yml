name: Build Danyusha Beauty City APK

on:
  push:
    branches:
      - danyusha-beauty-city
    paths:
      - 'danyusha-beauty-city/**'
      - '.github/workflows/build-danyusha-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: danyusha-beauty-city
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp danyusha-beauty-city/app/build/outputs/apk/debug/app-debug.apk artifacts/Danyusha_Beauty_City_v0.3-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Danyusha_Beauty_City_v0.3_APK
          path: artifacts/Danyusha_Beauty_City_v0.3-debug.apk
          retention-days: 30
