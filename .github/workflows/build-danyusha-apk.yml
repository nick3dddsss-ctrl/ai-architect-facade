name: Build Danyusha Beauty City APK

on:
  push:
    branches:
      - danyusha-beauty-city
    paths:
      - 'danyusha-beauty-city/**'
      - '.github/workflows/build-danyusha-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: danyusha-beauty-city
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p artifacts
          cp danyusha-beauty-city/app/build/outputs/apk/debug/app-debug.apk artifacts/Danyusha_Beauty_City_v0.3-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Danyusha_Beauty_City_v0.3_APK
          path: artifacts/Danyusha_Beauty_City_v0.3-debug.apk
          retention-days: 30
