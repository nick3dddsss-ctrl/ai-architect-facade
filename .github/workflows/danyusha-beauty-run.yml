name: Build Danyusha Android TV APK

on:
  push:
    branches:
      - build/danyusha-beauty-run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Android SDK
        run: |
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -20
          ls "$ANDROID_HOME/build-tools" | tail -20

      - name: Unpack game
        run: |
          mkdir -p build-danyusha
          unzip -o experiments/danyusha-beauty-run/project.zip -d build-danyusha

      - name: Build debug APK
        run: gradle --no-daemon -p build-danyusha/danyusha_tv_game_vector :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Danyusha-Beauty-City-AndroidTV
          path: build-danyusha/danyusha_tv_game_vector/app/build/outputs/apk/debug/app-debug.apk
