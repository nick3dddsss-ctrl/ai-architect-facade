name: Build Danyusha Android TV APK

on:
  push:
    branches:
      - build/danyusha-beauty-run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack game
        run: |
          mkdir -p build-danyusha
          unzip -o experiments/danyusha-beauty-run/project.zip -d build-danyusha

      - name: Build debug APK
        run: gradle --no-daemon -p build-danyusha/danyusha_tv_game_vector :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Danyusha-Beauty-City-AndroidTV
          path: build-danyusha/danyusha_tv_game_vector/app/build/outputs/apk/debug/app-debug.apk
